quarkus.http.root-path=/onboarding-service

app.name=${APP_NAME:Onboarding-SVC}

# JWT authentication
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:http://localhost:9091/token-service/api/.well-known/jwks.json}
mp.jwt.verify.issuer=${JWT_ISSUER:https://apis.internal.dsoto.cl}
mp.jwt.verify.audiences=${JWT_AUDIENCE:onboarding-svc}

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8000}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD

# Local identity event transport names.
identity.events.aws.region=${AWS_REGION:us-east-1}
identity.events.topic.name=${IDENTITY_EVENTS_TOPIC_NAME:identity-events}
identity.events.queue.name=${ONBOARDING_IDENTITY_EVENTS_QUEUE_NAME:onboarding-identity-events}
identity.events.dlq.name=${ONBOARDING_IDENTITY_EVENTS_DLQ_NAME:onboarding-identity-events-dlq}
identity.events.consumer.enabled=${IDENTITY_EVENTS_CONSUMER_ENABLED:false}
identity.events.sqs.endpoint-override=${IDENTITY_EVENTS_SQS_ENDPOINT_OVERRIDE:}
identity.events.sqs.poll-every=${IDENTITY_EVENTS_SQS_POLL_EVERY:1s}
identity.events.sqs.max-messages=${IDENTITY_EVENTS_SQS_MAX_MESSAGES:10}
identity.events.sqs.wait-time-seconds=${IDENTITY_EVENTS_SQS_WAIT_TIME_SECONDS:20}

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:onboarding-dev;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:onboarding;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.identity.events.consumer.enabled=false
