quarkus.http.root-path=/onboarding-service

app.name=${APP_NAME:Onboarding-SVC}

# JWT authentication
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:http://localhost:9091/token-service/api/.well-known/jwks.json}
mp.jwt.verify.issuer=${JWT_ISSUER:https://apis.internal.dsoto.cl}
mp.jwt.verify.audiences=${JWT_AUDIENCE:onboarding-svc}

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8000}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD

# Local identity event transport names.
identity.events.aws.region=${AWS_REGION:us-east-1}
identity.events.topic.name=${IDENTITY_EVENTS_TOPIC_NAME:identity-events}
identity.events.queue.name=${ONBOARDING_IDENTITY_EVENTS_QUEUE_NAME:onboarding-identity-events}
identity.events.dlq.name=${ONBOARDING_IDENTITY_EVENTS_DLQ_NAME:onboarding-identity-events-dlq}
identity.events.consumer.enabled=${IDENTITY_EVENTS_CONSUMER_ENABLED:false}
identity.events.sqs.endpoint-override=${IDENTITY_EVENTS_SQS_ENDPOINT_OVERRIDE:}
identity.events.sqs.poll-every=${IDENTITY_EVENTS_SQS_POLL_EVERY:1s}
identity.events.sqs.max-messages=${IDENTITY_EVENTS_SQS_MAX_MESSAGES:10}
identity.events.sqs.wait-time-seconds=${IDENTITY_EVENTS_SQS_WAIT_TIME_SECONDS:20}

# HTTP identity event feed from token-svc.
quarkus.rest-client.token-auth.url=${TOKEN_SERVICE_BASE_URL:http://localhost:9091/token-service}
quarkus.rest-client.token-identity-events.url=${TOKEN_SERVICE_BASE_URL:http://localhost:9091/token-service}
token.service.client-id=${TOKEN_SERVICE_CLIENT_ID:onboarding-svc}
token.service.client-secret=${TOKEN_SERVICE_CLIENT_SECRET:}
token.service.identity-events.scope=${TOKEN_SERVICE_IDENTITY_EVENTS_SCOPE:token.identity-events.read}
token.service.access-token-refresh-skew-seconds=${TOKEN_SERVICE_ACCESS_TOKEN_REFRESH_SKEW_SECONDS:60}
identity.events.feed.enabled=${IDENTITY_EVENTS_FEED_ENABLED:false}
identity.events.feed.poll-every=${IDENTITY_EVENTS_FEED_POLL_EVERY:5s}
identity.events.feed.limit=${IDENTITY_EVENTS_FEED_LIMIT:100}
identity.events.feed.source=${IDENTITY_EVENTS_FEED_SOURCE:token-svc}

# HTTP profile event feed from profile-svc.
quarkus.rest-client.profile-events.url=${PROFILE_SERVICE_BASE_URL:http://localhost:9092/profile-service}
profile.service.profile-events.scope=${PROFILE_SERVICE_PROFILE_EVENTS_SCOPE:profile.profile-events.read}
profile.events.feed.enabled=${PROFILE_EVENTS_FEED_ENABLED:false}
profile.events.feed.poll-every=${PROFILE_EVENTS_FEED_POLL_EVERY:5s}
profile.events.feed.limit=${PROFILE_EVENTS_FEED_LIMIT:100}
profile.events.feed.source=${PROFILE_EVENTS_FEED_SOURCE:profile-svc}
